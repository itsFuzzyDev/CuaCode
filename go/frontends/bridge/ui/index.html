<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-eval'; style-src 'self'; img-src 'self' data:; connect-src 'none'">
<title>CuaCode</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
  <aside class="side">
    <div class="brand">
      <span class="brand-word">Cua<em>Code</em></span>
      <span class="pill">Bridge</span>
      <button class="side-toggle" id="sidetoggle" title="collapse sidebar">
        <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
    </div>
    <div class="search" id="search" title="search - cmd+K">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5"/></svg>
      <span class="search-word">Search</span>
      <span class="kbd">&#8984;K</span>
    </div>
    <div class="secthead">
      <span class="sectlabel">Projects</span>
      <span class="secticons">
        <button class="icon" id="projsort" title="sort sessions: recency / name">
          <svg viewBox="0 0 24 24"><path d="M9 19V5M9 5L5.5 8.5M9 5l3.5 3.5"/><path d="M15 5v14M15 19l-3.5-3.5M15 19l3.5-3.5"/></svg>
        </button>
        <button class="icon" id="projadd" title="open project">
          <svg viewBox="0 0 24 24"><path d="M3 7c0-1.1.9-2 2-2h4l2 2h8c1.1 0 2 .9 2 2v9c0 1.1-.9 2-2 2H5c-1.1 0-2-.9-2-2V7z"/><path d="M12 11v6M9 14h6"/></svg>
        </button>
        <button class="icon" id="projnew" title="new session">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </span>
    </div>
    <nav class="tree" id="tree" aria-label="projects and sessions"></nav>
  </aside>

  <main class="main">
    <header class="top">
      <span class="name" id="sessname"></span>
      <span class="tag" id="project" hidden></span>
    </header>
    <div id="workspace" class="workspace" tabindex="-1"></div>
    <footer class="bar">
      <div class="status" id="status"></div>
      <div class="tray" id="tray" hidden></div>
      <div class="entry">
        <span class="caret" id="caret">&rsaquo;</span>
        <textarea id="input" rows="1" spellcheck="false" autocomplete="off"
                  placeholder="tell the agent what to do"></textarea>
      </div>
    </footer>
  </main>

  <div class="veil" id="veil" hidden>
    <div class="palette" role="dialog" aria-label="command palette">
      <div class="p-find">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5"/></svg>
        <input id="pq" placeholder="Search sessions, projects, actions" spellcheck="false" autocomplete="off">
        <span class="kbd">esc</span>
      </div>
      <div class="p-rows" id="prows"></div>
    </div>
  </div>

  <script src="fixture.js"></script>
  <script src="app.js"></script>
</body>
</html>
